name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: make test

  build:
    name: Build Package
    needs: test
    runs-on: ubuntu-latest  # PyPI publish action requires Linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify branch (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          CURRENT_BRANCH="${GITHUB_REF#refs/heads/}"

          if [ "$CURRENT_BRANCH" != "main" ]; then
            echo "❌ Manual dispatch must be triggered from main branch!"
            echo "Current branch: $CURRENT_BRANCH"
            echo "Required branch: main"
            exit 1
          fi

          echo "✅ Branch check passed: $CURRENT_BRANCH"

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")

          if [ "${{ github.event_name }}" = "release" ]; then
            # For releases: verify against the release tag
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"

            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "❌ Version mismatch!"
              echo "Git tag: v$TAG_VERSION"
              echo "pyproject.toml: $PKG_VERSION"
              exit 1
            fi

            echo "✅ Version matches release tag: $PKG_VERSION"

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # For manual dispatch: verify against the latest git tag
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
            LATEST_TAG_VERSION="${LATEST_TAG#v}"

            if [ "$LATEST_TAG" = "none" ]; then
              echo "❌ No git tags found! Cannot verify version."
              echo "Please create a git tag first: git tag v$PKG_VERSION"
              exit 1
            fi

            if [ "$LATEST_TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "❌ Version mismatch!"
              echo "Latest git tag: v$LATEST_TAG_VERSION"
              echo "pyproject.toml: $PKG_VERSION"
              echo ""
              echo "Before publishing, please:"
              echo "  1. Update version in pyproject.toml to $LATEST_TAG_VERSION, OR"
              echo "  2. Create a new tag: git tag v$PKG_VERSION && git push --tags"
              exit 1
            fi

            echo "✅ Version matches latest git tag: v$PKG_VERSION"
          fi

      - name: Build package
        run: |
          python -m build
          echo "📦 Built packages:"
          ls -lh dist/

      - name: Check package metadata
        run: |
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: inputs.test_pypi == true
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/qwenvert/
    permissions:
      contents: read
      id-token: write  # REQUIRED: For trusted publishing (OIDC)

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: inputs.test_pypi != true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qwenvert/
    permissions:
      contents: read
      id-token: write  # REQUIRED: For trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Upload artifacts to release
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          overwrite: true

      - name: Create release summary
        run: |
          VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 qwenvert v$VERSION Published!

          ### Installation
          \`\`\`bash
          pip install qwenvert
          \`\`\`

          ### Links
          - 📦 [PyPI Package](https://pypi.org/project/qwenvert/$VERSION/)
          - 📝 [Release Notes](https://github.com/${{ github.repository }}/releases/tag/v$VERSION)
          - 📚 [Documentation](https://github.com/${{ github.repository }}/blob/main/README.md)

          ### Next Steps
          - Update Homebrew formula (if applicable)
          - Announce release
          - Close milestone
          EOF

  verify-macos:
    name: Verify macOS Installation
    needs: [publish-testpypi, publish-pypi]
    if: always() && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success')
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify installation with retry
        run: |
          # Extract version from tag (remove 'v' prefix)
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")
          fi

          echo "📦 Attempting to install qwenvert version $VERSION from PyPI..."
          
          # Test installation in clean environment
          python -m venv test_env
          source test_env/bin/activate

          # Retry loop: 5 attempts with 30-second sleep between attempts
          # Use --index-url to force canonical PyPI index (bypasses edge caches)
          for i in {1..5}; do
            echo "🔄 Attempt $i of 5..."
            
            if pip install "qwenvert==$VERSION" --no-cache-dir --index-url https://pypi.org/simple; then
              echo "✅ Successfully installed qwenvert==$VERSION"
              break
            else
              if [ $i -eq 5 ]; then
                echo "❌ PyPI failed to index version $VERSION within the timeout period."
                exit 1
              fi
              echo "⏳ Waiting for PyPI CDN to propagate... (30 seconds)"
              sleep 30
            fi
          done

          # Verify installation
          echo "🔍 Verifying installation..."
          qwenvert --version
          
          echo "✅ macOS installation verified"
