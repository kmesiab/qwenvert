name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        default: false
        type: boolean

jobs:
  build-and-publish:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write  # For trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify version matches tag
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Git tag: v$TAG_VERSION"
            echo "pyproject.toml: $PKG_VERSION"
            exit 1
          fi

          echo "✅ Version match: $PKG_VERSION"

      - name: Build package
        run: |
          python -m build
          echo "📦 Built packages:"
          ls -lh dist/

      - name: Check package metadata
        run: |
          python -m twine check dist/*

      - name: Run tests before publishing
        run: |
          pip install -e ".[dev]"
          make test

      - name: Publish to TestPyPI
        if: inputs.test_pypi == true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          python -m twine upload --repository testpypi dist/*
          echo "✅ Published to TestPyPI: https://test.pypi.org/project/qwenvert/"

      - name: Publish to PyPI
        if: github.event_name == 'release' && inputs.test_pypi != true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist/*
          echo "✅ Published to PyPI: https://pypi.org/project/qwenvert/"

      - name: Upload artifacts to release
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Verify installation
        if: github.event_name == 'release'
        run: |
          # Wait for PyPI to update
          sleep 60

          # Test installation in clean environment
          python -m venv test_env
          source test_env/bin/activate

          pip install qwenvert
          qwenvert --version
          qwenvert --help

          echo "✅ Installation verified"

      - name: Create release summary
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 qwenvert v$VERSION Published!

          ### Installation
          \`\`\`bash
          pip install qwenvert
          \`\`\`

          ### Links
          - 📦 [PyPI Package](https://pypi.org/project/qwenvert/$VERSION/)
          - 📝 [Release Notes](https://github.com/${{ github.repository }}/releases/tag/v$VERSION)
          - 📚 [Documentation](https://github.com/${{ github.repository }}/blob/main/README.md)

          ### Next Steps
          - Update Homebrew formula (if applicable)
          - Announce release
          - Close milestone
          EOF
