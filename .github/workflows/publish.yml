name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Publish to TestPyPI instead of PyPI'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: make test

  build:
    name: Build Package
    needs: test
    runs-on: ubuntu-latest  # PyPI publish action requires Linux
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify version matches tag
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "Git tag: v$TAG_VERSION"
            echo "pyproject.toml: $PKG_VERSION"
            exit 1
          fi

          echo "✅ Version match: $PKG_VERSION"

      - name: Build package
        run: |
          python -m build
          echo "📦 Built packages:"
          ls -lh dist/

      - name: Check package metadata
        run: |
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: inputs.test_pypi == true
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/qwenvert/
    permissions:
      contents: read
      id-token: write  # REQUIRED: For trusted publishing (OIDC)

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: inputs.test_pypi != true
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qwenvert/
    permissions:
      contents: read
      id-token: write  # REQUIRED: For trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true

      - name: Upload artifacts to release
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          overwrite: true

      - name: Create release summary
        run: |
          VERSION=$(python -c "import tomllib; f=open('pyproject.toml','rb'); print(tomllib.load(f)['project']['version'])")

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🚀 qwenvert v$VERSION Published!

          ### Installation
          \`\`\`bash
          pip install qwenvert
          \`\`\`

          ### Links
          - 📦 [PyPI Package](https://pypi.org/project/qwenvert/$VERSION/)
          - 📝 [Release Notes](https://github.com/${{ github.repository }}/releases/tag/v$VERSION)
          - 📚 [Documentation](https://github.com/${{ github.repository }}/blob/main/README.md)

          ### Next Steps
          - Update Homebrew formula (if applicable)
          - Announce release
          - Close milestone
          EOF

  verify-macos:
    name: Verify macOS Installation
    needs: [publish-testpypi, publish-pypi]
    if: always() && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success')
    runs-on: macos-latest

    steps:
      - name: Wait for PyPI CDN to propagate
        run: |
          echo "⏳ Waiting 90 seconds for PyPI to propagate..."
          sleep 90

      - name: Test installation on macOS
        run: |
          # Test installation in clean environment
          python -m venv test_env
          source test_env/bin/activate

          pip install qwenvert
          qwenvert --version
          qwenvert --help

          echo "✅ macOS installation verified"
