[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require running backends, slower)
    security: Security and isolation tests (critical for privacy guarantees)

# Async support
asyncio_mode = auto

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Coverage options (optional)
# Uncomment to enable coverage reporting
# addopts = --cov=qwenvert --cov-report=term-missing --cov-report=html
