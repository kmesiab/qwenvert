[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwenvert"
version = "0.1.0"
description = "One-click local LLM inference for Claude Code on Mac M1"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Kyle Mesiab", email = "kmesiab@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS :: MacOS X",
]

# Runtime dependencies
dependencies = [
    "click>=8.1.7",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=6.0.0",
    "types-PyYAML>=6.0.12",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # defaults
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".git",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable strict rule sets
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EM",    # flake8-errmsg
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "INP",   # flake8-no-pep420
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "INT",   # flake8-gettext
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "TD",    # flake8-todos
    "FIX",   # flake8-fixme
    "ERA",   # eradicate
    "PD",    # pandas-vet
    "PGH",   # pygrep-hooks
    "PL",    # pylint
    "TRY",   # tryceratops
    "FLY",   # flynt
    "NPY",   # numpy-specific rules
    "PERF",  # perflint
    "FURB",  # refurb
    "LOG",   # flake8-logging
    "RUF",   # ruff-specific rules
]

ignore = [
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "ANN401",  # Dynamically typed expressions (Any is sometimes necessary)
    "D203",    # 1 blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "COM812",  # Trailing comma missing (conflicts with formatter)
    "ISC001",  # Implicit string concatenation (conflicts with formatter)
    "PLR2004", # Magic value in comparison (acceptable for constants)
    "S607",    # Starting process with partial executable path (acceptable for system binaries)
    "S603",    # subprocess call with shell=False (acceptable)
    "S110",    # try-except-pass (sometimes acceptable)
    "S104",    # Possible binding to all interfaces (localhost bindings are intentional)
    "ERA001",  # Found commented-out code (allow explanatory comments)
    "TRY003",  # Avoid specifying long messages outside exception class (too restrictive)
    "TRY300",  # Consider moving statement to else block (too pedantic)
    "TRY301",  # Abstract raise to inner function (too pedantic)
    "EM102",   # Exception must not use f-string literal (too restrictive)
    "G004",    # Logging statement uses f-string (f-strings are fine for logging)
    "G201",    # Use .exception instead of .error with exc_info (both are acceptable)
    "BLE001",  # Catching broad exceptions (sometimes necessary)
    "SIM117",  # Nested with statements (sometimes more readable)
    "PTH123",  # Use Path.open() (open() is fine)
    "PERF203", # try-except in loop (sometimes necessary)
    "PERF401", # List comprehension (sometimes less readable)
    "FBT001",  # Boolean positional arg (reasonable pattern)
    "FBT002",  # Boolean default positional arg (reasonable pattern)
    "FBT003",  # Boolean positional value (reasonable pattern)
    "PLC0415", # Import outside top-level (sometimes necessary)
    "ASYNC110", # asyncio.Event vs sleep (sleep is fine for polling)
    "ASYNC220", # Async subprocess blocking calls (sometimes necessary)
    "ASYNC221", # Async process blocking calls (sometimes necessary)
    "ASYNC240", # Async pathlib calls (sometimes necessary)
    "PLW1510", # subprocess.run without check (sometimes acceptable)
    "ARG001",  # Unused function argument (common in interfaces)
    "ARG002",  # Unused method argument (common in interfaces)
    "RUF006",  # asyncio.create_task reference (sometimes not needed)
    "B904",    # raise from (sometimes not applicable)
    "E501",    # Line too long (black handles this, some exceptions needed)
    "UP006",   # Use lowercase list/dict (not compatible with Python 3.9 + Pydantic)
    "UP007",   # Use X | Y for union types (breaks Pydantic in Python 3.9)
    "UP035",   # Deprecated typing imports (Dict/List work fine, lowercase breaks in 3.9)
    "FA100",   # from __future__ import annotations (breaks Pydantic in Python 3.9)
    "EM101",   # Exception string literal (acceptable for simple errors)
    "RET504",  # Unnecessary assignment before return (sometimes more readable)
    "ANN201",  # Missing return type for public function (mostly covered)
    "ANN204",  # Missing return type for __init__ (always None, not needed)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Allow assert in tests
    "ANN",     # Don't require annotations in tests
    "PLR2004", # Allow magic values in tests
    "S105",    # Allow hardcoded passwords in tests
    "S106",    # Allow hardcoded passwords in tests
    "S110",    # Allow try-except-pass in tests
    "S603",    # Allow subprocess calls in tests
    "SLF001",  # Allow accessing private members in tests (required for unit testing)
    "PLC0415", # Allow imports inside functions in tests
    "INP001",  # Allow missing __init__.py in test directories
    "ARG002",  # Allow unused method arguments in test fixtures
    "BLE001",  # Allow catching broad exceptions in tests
    "PT011",   # Allow broad pytest.raises in tests
    "B017",    # Allow asserting broad exceptions in tests
    "FBT001",  # Allow boolean positional args in tests
    "FBT002",  # Allow boolean default args in tests
    "FBT003",  # Allow boolean positional values in tests
    "PLW1510", # Allow subprocess.run without check in tests
    "ASYNC220", # Allow async subprocess calls in tests
]
"**/__init__.py" = [
    "F401",    # Allow unused imports in __init__.py
]
"qwenvert/cli.py" = [
    "ANN001",  # Click decorators handle typing
    "PLR0912", # CLI commands can be complex
    "PLR0915", # CLI commands can have many statements
]
"qwenvert/adapter.py" = [
    "ANN202",  # Private functions don't need return annotations
]
"qwenvert/dashboard.py" = [
    "ANN001",  # Rich console functions don't need strict typing
]
"qwenvert/launcher.py" = [
    "ANN001",  # Signal handlers have standard signatures
]
"qwenvert/models.py" = [
    "PLR0911", # Model selection logic has multiple returns
]

[tool.ruff.lint.isort]
known-first-party = ["qwenvert"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.mypy]
python_version = "3.9"
strict = false
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = false
warn_unreachable = false
strict_equality = false
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "qwenvert.router"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "mlx.*",
    "mlx_lm.*",
    "psutil.*",
    "cpuinfo.*",
    "prometheus_client.*",
    "huggingface_hub.*",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=qwenvert",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["qwenvert"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
